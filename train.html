<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BWL-App</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.base.css">
  <link rel="stylesheet" href="css/style.layout.css">
  <link rel="stylesheet" href="css/style.components.css">
  <link rel="stylesheet" href="css/style.accessibility.css">
  <link rel="stylesheet" href="css/style.animations.css">
  <link rel="stylesheet" href="css/style.dashboard.css"><!-- optional je Seite -->
</head>
<body data-page="train">
  <header class="app">
    <div class="container">
      <div class="brand">
        <strong class="brand-title">BWL-App</strong>
        <small class="muted brand-sub">Lernplattform für Kostenrechnung</small>
      </div>
      <nav aria-label="Hauptnavigation">
        <ul class="nav">
          <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li><a class="nav-link" href="train.html">Trainieren</a></li>
          <li><a class="nav-link" href="achievements.html">Erfolge</a></li>
          <li><a class="nav-link" href="settings.html">Einstellungen</a></li>
        </ul>
      </nav>
    </div>
  </header>


<main class="container no-page-scroll">
  <section class="card card-fit train-layout">
    <div class="task-area">
      <h2 id="session-pill" class="pill">Thema • Stufe 1</h2>
      <p id="train-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="bab-wrapper" class="task-slot slim-scroll"></div>

      <div class="task-controls">
        <button class="btn" id="btn-check" data-action="check">Prüfen</button>
        <button class="btn" id="btn-reveal" data-action="reveal">Lösung anzeigen</button>
        <button class="btn" id="btn-next" data-action="next">Nächste</button>
        <button class="btn" id="btn-change-topic">Thema wechseln!</button>
        <button class="btn ghost" id="btn-skip-topic">Dieses Thema benötige ich nicht!</button>
      </div>

      <!-- calc.js creates and wires its own calculator panel here. -->
    </div>

    <aside class="sidebar">
      <div class="mini-card">
        <h4>Rang</h4>
        <div class="rank-row"><span id="rank-badge" class="badge pill">BWL-Justus</span></div>
        <div class="level">
          <div class="bar"><i id="rank-level-fill"></i></div>
          <small id="rank-level-label" class="muted">Level 1 → 2 · 0/100 XP</small>
        </div>
      </div>
      <div class="mini-card slim-scroll">
        <h3>Fortschritt</h3>
        <div id="topic-progress-train" class="prog-list"></div>
      </div>
    </aside>
  </section>
</main>

  <footer class="footer">
    <div class="container">
      <p class="muted version-text">Version <span id="app-version">–</span></p>
    </div>
  </footer>



  <script defer src="js/topics.js"></script>
  <script defer src="js/progress.js"></script>
  <script defer src="js/app-shell.js"></script>
  <script defer src="js/quickstart.js"></script>
  <script defer src="js/train/engine.js"></script>
  <script defer src="js/train/topics/break-even.js"></script>
  <script defer src="js/train/topics/bab.js"></script>
  <script defer src="js/train/topics/kostenarten.js"></script>
  <script defer src="js/train/topics/abgrenzung.js"></script>
  <script defer src="js/train/topics/kostenstellen.js"></script>
  <script defer src="js/train/topics/deckungsbeitrag.js"></script>
  <script defer src="js/train/topics/aequivalenz.js"></script>
  <script defer src="js/train/topics/zuschlag.js"></script>
  <script defer src="js/train/topics/prozesskosten.js"></script>
  <script defer src="js/train/topics/kennzahlen.js"></script>
  <script defer src="js/train/topics/investition.js"></script>
  <script defer src="js/train/topics/lager.js"></script>
  <script defer src="js/calc.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
